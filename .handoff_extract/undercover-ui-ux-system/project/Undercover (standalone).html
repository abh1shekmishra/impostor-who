document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

list=\"{{ diffChips }}\" as=\"d\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ d.onClick }}\" style=\"{{ d.style }}\">{{ d.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- toggles -->\n          <div style=\"padding:2px 16px;border-radius:16px;border:1px solid #232230;background:#14131a;\">\n            <sc-for list=\"{{ createToggles }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button onclick=\"{{ t.onClick }}\" style=\"{{ t.row }}\">\n                <span style=\"display:flex;flex-direction:column;gap:2px;\">\n                  <span style=\"font:600 15px 'Space Grotesk';color:#f4f2f7;\">{{ t.label }}<\u002Fspan>\n                  <span style=\"font:400 12px 'Space Grotesk';color:#8b8898;\">{{ t.desc }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"{{ t.track }}\"><span style=\"{{ t.knob }}\"><\u002Fspan><\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button onclick=\"{{ toLobby }}\" style=\"margin-top:18px;width:100%;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;display:flex;align-items:center;justify-content:center;gap:10px;\">Add Players<svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ LOBBY ============ -->\n      <sc-if value=\"{{ isLobby }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Lobby\" style=\"animation:screenIn .4s ease both;flex:1;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),22px) 22px max(env(safe-area-inset-bottom),22px);\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px;\">\n          <button onclick=\"{{ goCreate }}\" aria-label=\"Back\" style=\"width:42px;height:42px;border-radius:50%;border:1px solid #2a2935;background:#16151c;color:#c9c6d4;cursor:pointer;display:grid;place-items:center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;\">\n            <h2 style=\"margin:0;font-family:'Anton';font-size:30px;line-height:1;text-transform:uppercase;color:#f4f2f7;\">The Table<\u002Fh2>\n            <span style=\"font:500 12px 'Space Mono';color:#8b8898;\">{{ lobbyStatus }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:9px;flex:1;\">\n          <sc-for list=\"{{ seatList }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:14px;border:1px solid #232230;background:#14131a;\">\n              <span style=\"flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 17px 'Space Grotesk';color:#0b0a0f;background:{{ p.color }};\">{{ p.initial }}<\u002Fspan>\n              <span style=\"flex:1;font:600 16px 'Space Grotesk';color:#f4f2f7;\">{{ p.name }}<\u002Fspan>\n              <span style=\"font:500 11px 'Space Mono';color:#6b6878;\">{{ p.seat }}<\u002Fspan>\n              <button onclick=\"{{ p.remove }}\" aria-label=\"Remove\" style=\"width:30px;height:30px;border-radius:9px;border:1px solid #2a2935;background:transparent;color:#8b8898;cursor:pointer;display:grid;place-items:center;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex;gap:9px;margin-top:4px;\">\n            <input value=\"{{ nameDraft }}\" oninput=\"{{ setDraft }}\" onkeydown=\"{{ draftKey }}\" placeholder=\"Add a name…\" style=\"flex:1;padding:14px 15px;border-radius:14px;border:1px solid #2a2935;background:#100f15;color:#f4f2f7;font:600 15px 'Space Grotesk';outline:none;\">\n            <button onclick=\"{{ addDraft }}\" aria-label=\"Add\" style=\"flex:0 0 auto;width:52px;border-radius:14px;border:1px solid #f5402e55;background:#f5402e1f;color:#f5402e;font-size:26px;cursor:pointer;line-height:1;\">+<\u002Fbutton>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ hasSuggestions }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:8px;display:flex;flex-direction:column;gap:9px;\">\n            <span style=\"font:600 11px 'Space Mono';letter-spacing:.14em;text-transform:uppercase;color:#6b6878;\">Saved players<\u002Fspan>\n            <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n              <sc-for list=\"{{ suggestions }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <button onclick=\"{{ s.onClick }}\" style=\"padding:9px 14px;border-radius:999px;border:1px solid #2a2935;background:#16151c;color:#c9c6d4;font:600 13px 'Space Grotesk';cursor:pointer;display:inline-flex;align-items:center;gap:6px;\">+ {{ s.name }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:10px;margin-top:16px;\">\n          <button onclick=\"{{ reshuffle }}\" aria-label=\"Reshuffle seats\" style=\"flex:0 0 auto;width:58px;border-radius:18px;border:1px solid #2a2935;background:#16151c;color:#c9c6d4;cursor:pointer;display:grid;place-items:center;\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <button onclick=\"{{ startGame }}\" disabled=\"{{ startDisabled }}\" style=\"{{ startBtnStyle }}\">{{ startLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ REVEAL ============ -->\n      <sc-if value=\"{{ isReveal }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Reveal\" style=\"animation:screenIn .35s ease both;flex:1;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),24px) 24px max(env(safe-area-inset-bottom),24px);\">\n        <!-- cover -->\n        <sc-if value=\"{{ revealCover }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;\">\n          <span style=\"font:700 12px 'Space Mono';letter-spacing:.24em;text-transform:uppercase;color:#8b8898;\">{{ revealCounter }}<\u002Fspan>\n          <div style=\"animation:floaty 3.4s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;gap:18px;\">\n            <span style=\"width:96px;height:96px;border-radius:28px;display:grid;place-items:center;font:700 42px 'Space Grotesk';color:#0b0a0f;background:{{ revealColor }};box-shadow:0 18px 50px -12px {{ revealColor }};\">{{ revealInitial }}<\u002Fspan>\n            <h2 style=\"margin:0;font-family:'Anton';font-size:46px;line-height:.95;text-transform:uppercase;color:#f4f2f7;\">Pass to<br>{{ revealName }}<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0;max-width:240px;font-size:15px;line-height:1.45;color:#9a97a8;\">Make sure no one's peeking, then hold the card to reveal your secret.<\u002Fp>\n          <button onpointerdown=\"{{ holdStart }}\" onpointerup=\"{{ holdEnd }}\" onpointerleave=\"{{ holdEnd }}\" style=\"margin-top:6px;width:100%;border:0;border-radius:18px;padding:20px;background:#1d1c25;border:1px solid #2a2935;color:#f4f2f7;font:700 17px 'Space Grotesk';cursor:pointer;displ an style=\"font:700 12px 'Space Mono';letter-spacing:.24em;text-transform:uppercase;color:#f5402e;\">You're the Impostor<\u002Fspan>\n            <p style=\"margin:0;font-size:15px;color:#f3a59c;\">{{ impostorLead }}<\u002Fp>\n            <h2 style=\"margin:0;font-family:'Anton';font-size:54px;line-height:.92;text-transform:uppercase;color:#f4f2f7;\">{{ impostorWordDisplay }}<\u002Fh2>\n            <p style=\"margin:0;max-width:240px;font-size:14px;line-height:1.45;color:#cf938c;\">Bluff your way through. Blend in. Don't get caught.<\u002Fp>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n          <button onclick=\"{{ nextReveal }}\" style=\"margin-top:24px;width:100%;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;\">{{ revealNextLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ CLUE ============ -->\n      <sc-if value=\"{{ isClue }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Clue\" style=\"animation:screenIn .35s ease both;flex:1;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),26px) 24px max(env(safe-area-inset-bottom),24px);\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n          <span style=\"font:700 12px 'Space Mono';letter-spacing:.22em;text-transform:uppercase;color:#e8b339;\">Clue round<\u002Fspan>\n          <span style=\"font:600 13px 'Space Grotesk';color:#8b8898;\">{{ clueProgress }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:7px;margin-top:14px;\">\n          <sc-for list=\"{{ clueDots }}\" as=\"d\" hint-placeholder-count=\"6\">\n            <span style=\"{{ d.style }}\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;\">\n          <span style=\"font:600 13px 'Space Grotesk';color:#8b8898;\">It's your turn,<\u002Fspan>\n          <span style=\"width:108px;height:108px;border-radius:32px;display:grid;place-items:center;font:700 48px 'Space Grotesk';color:#0b0a0f;background:{{ clueColor }};box-shadow:0 18px 50px -12px {{ clueColor }};\">{{ clueInitial }}<\u002Fspan>\n          <h2 style=\"margin:0;font-family:'Anton';font-size:60px;line-height:.9;text-transform:uppercase;color:#f4f2f7;\">{{ clueName }}<\u002Fh2>\n          <p style=\"margin:0;max-width:260px;font-size:16px;line-height:1.45;color:#b6b3c2;\">Say <b style=\"color:#f4f2f7;\">one word<\u002Fb> that hints at your secret — clever enough to prove you know it, vague enough to survive.<\u002Fp>\n        <\u002Fdiv>\n        <button onclick=\"{{ nextClue }}\" style=\"width:100%;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;\">{{ clueNextLabel }}<\u002Fbutton>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ DISCUSS ============ -->\n      <sc-if value=\"{{ isDiscuss }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Discuss\" style=\"animation:screenIn .35s ease both;flex:1;display:flex;flex-direction:column;align-items:center;padding:max(env(safe-area-inset-top),30px) 24px max(env(safe-area-inset-bottom),24px);\">\n        <span style=\"font-family:'Anton';font-size:40px;text-transform:uppercase;color:#f4f2f7;letter-spacing:.02em;\">Discuss<\u002Fspan>\n        <p style=\"margin:8px 0 0;font-size:15px;color:#9a97a8;text-align:center;max-width:250px;\">{{ discussPrompt }}<\u002Fp>\n        <div style=\"flex:1;display:flex;align-items:center;justify-content:center;width:100%;\">\n          <div style=\"position:relative;width:268px;height:268px;display:grid;place-items:center;\">\n            <svg width=\"268\" height=\"268\" viewBox=\"0 0 umn;gap:18px;flex:1;\">\n          <div style=\"display:flex;flex-direction:column;gap:9px;\">\n            <span style=\"font:700 11px 'Space Mono';letter-spacing:.16em;text-transform:uppercase;color:#6b6878;\">Appearance<\u002Fspan>\n            <div style=\"padding:16px;border-radius:16px;border:1px solid #232230;background:#14131a;display:flex;align-items:center;justify-content:space-between;\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font:600 15px 'Space Grotesk';color:#f4f2f7;\">Theme<\u002Fspan><span style=\"font:400 12px 'Space Grotesk';color:#8b8898;\">Tuned for dark rooms<\u002Fspan><\u002Fdiv>\n              <span style=\"display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;border:1px solid #2a2935;color:#c9c6d4;font:600 13px 'Space Grotesk';\"><span style=\"width:8px;height:8px;border-radius:50%;background:#0b0a0f;border:1px solid #555;\"><\u002Fspan>Cinema dark<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px;\">\n            <span style=\"font:700 11px 'Space Mono';letter-spacing:.16em;text-transform:uppercase;color:#6b6878;\">Feel<\u002Fspan>\n            <div style=\"padding:2px 16px;border-radius:16px;border:1px solid #232230;background:#14131a;\">\n              <sc-for list=\"{{ settingsToggles }}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button onclick=\"{{ t.onClick }}\" style=\"{{ t.row }}\">\n                  <span style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font:600 15px 'Space Grotesk';color:#f4f2f7;\">{{ t.label }}<\u002Fspan><span style=\"font:400 12px 'Space Grotesk';color:#8b8898;\">{{ t.desc }}<\u002Fspan><\u002Fspan>\n                  <span style=\"{{ t.track }}\"><span style=\"{{ t.knob }}\"><\u002Fspan><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <di ">\n            <div style=\"padding:18px;border-radius:18px;border:1px solid #46c2ff33;background:linear-gradient(160deg,#0e1a22,#11131a);display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:'Anton';font-size:40px;color:#46c2ff;\">63%<\u002Fspan><span style=\"font:600 13px 'Space Grotesk';color:#9a97a8;\">Civilian win rate<\u002Fspan><\u002Fdiv>\n            <div style=\"padding:18px;border-radius:18px;border:1px solid #f5402e33;background:linear-gradient(160deg,#1a0e0f,#14111a);display:flex;flex-direction:column;gap:4px;\"><span style=\"font-family:'Anton';font-size:40px;color:#f5402e;\">41%<\u002Fspan><span style=\"font:600 13px 'Space Grotesk';color:#9a97a8;\">Impostor escape rate<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px;border-radius:18px;border:1px solid #232230;background:#14131a;display:flex;flex-direction:column;gap:14px;\">\n            <span style=\"font:600 13px 'Space Grotesk';color:#9a97a8;\">Outcomes across 37 rounds<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;gap:11px;\">\n              <sc-for list=\"{{ outcomeBars }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;flex-direction:column;gap:6px;\">\n                  <div style=\"display:flex;justify-content:space-between;\"><span style=\"font:600 13px 'Space Grotesk';color:#d9d6e2;\">{{ b.label }}<\u002Fspan><span style=\"font:700 13px 'Space Mono';color:#9a97a8;\">{{ b.value }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"height:9px;border-radius:999px;background:#232230;overflow:hidden;\"><div style=\"{{ b.fill }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;\">\n            <div style=\"padding:15px;border-radius:16px;border:1px solid #232230;background:#14131a;text-align:center;\"><div style=\"font-family:'Anton';font-size:28px;color:#f4f2f7;\">37<\u002Fdiv><div style=\"font:600 11px 'Space Grotesk';color:#8b8898;\">Rounds<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:15px;border-radius:16px;border:1px solid #232230;background:#14131a;text-align:center;\"><div style=\"font-family:'Anton';font-size:28px;color:#e8b339;\">6<\u002Fdiv><div style=\"font:600 11px 'Space Grotesk';color:#8b8898;\">Best streak<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:15px;border-radius:16px;border:1px solid #232230;background:#14131a;text-align:center;\"><div style=\"font-family:'Anton';font-size:28px;color:#f4f2f7;\">Mix<\u002Fdiv><div style=\"font:600 11px 'Space Grotesk';color:#8b8898;\">Most played<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ PACKS ============ -->\n      <sc-if value=\"{{ isPacks }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"Packs\" style=\"animation:screenIn .4s ease both;flex:1;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),22px) 22px max(env(safe-area-inset-bottom),24px);\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:6px;\">\n          <button onclick=\"{{ goHome }}\" aria-label=\"Back\" style=\"width:42px;height:42px;border-radius:50%;border:1px solid #2a2935;background:#16151c;color:#c9c6d4;cursor:pointer;display:grid;place-items:center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <h2 style=\"margin:0;font-family:'Anton';font-size:30px;text-transform:uppercase;color:#f4f2f7;\">Word Packs<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 16px 56px;font:400 13px 'Space Grotesk';color:#8b8898;\">A catalog that keeps growing.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:11px;flex:1;\">\n          <sc-for list=\"{{ packs }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div style=\"{{ p.card }}\">\n              <span style=\"flex:0 0 auto;width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:{{ p.tint }};border:1px solid {{ p.border }};\">{{ p.emoji }}<\u002Fspan>\n              <span style=\"flex:1;display:flex;flex-direction:column;gap:3px;\">\n                <span style=\"font:700 16px 'Space Grotesk';color:#f4f2f7;\">{{ p.name }}<\u002Fspan>\n                <span style=\"font:400 12px 'Space Grotesk';color:#8b8898;line-height:1.35;\">{{ p.desc }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"{{ p.badge }}\">{{ p.status }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ PEOPLE ============ -->\n      <sc-if value=\"{{ isPeople }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"People\" style=\"animation:screenIn .4s ease both;flex:1;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),22px) 22px max(env(safe-area-inset-bottom),24px);\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;\">\n          <button onclick=\"{{ goHome }}\" aria-label=\"Back\" style=\"width:42px;height:42px;border-radius:50%;border:1px solid #2a2935;background:#16151c;color:#c9c6d4;cursor:pointer;display:grid;place-items:center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;\"><h2 style=\"margin:0;font-family:'Anton';font-size:30px;text-transform:uppercase;color:#f4f2f7;\">People<\u002Fh2><span style=\"font:500 12px 'Space Mono';color:#8b8898;\">{{ peopleStatus }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:9px;margin-bottom:14px;\">\n          <input value=\"{{ nameDraft }}\" oninput=\"{{ setDraft }}\" onkeydown=\"{{ draftKey }}\" placeholder=\"Add someone…\" style=\"flex:1;padding:14px 15px;border-radius:14px;border:1px solid #2a2935;background:#100f15;color:#f4f2f7;font:600 15px 'Space Grotesk';outline:none;\">\n          <button onclick=\"{{ addDraft }}\" aria-label=\"Add\" style=\"flex:0 0 auto;width:52px;border-radius:14px;border:1px solid #f5402e55;background:#f5402e1f;color:#f5402e;font-size:26px;cursor:pointer;line-height:1;\">+<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ peopleEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;\">\n          <span style=\"width:70px;height:70px;border-radius:22px;border:1px dashed #3a3848;display:grid;place-items:center;font-size:30px;\">👋<\u002Fspan>\n          <span style=\"font:700 18px 'Space Grotesk';color:#f4f2f7;\">No regulars yet<\u002Fspan>\n          <span style=\"font:400 14px 'Space Grotesk';color:#8b8898;max-width:230px;\">Save the people you play with most so setup takes one tap next time.<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ peopleHas }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:9px;\">\n          <sc-for list=\"{{ peopleList }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:14px;border:1px solid #232230;background:#14131a;\">\n              <span style=\"flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 17px 'Space Grotesk';color:#0b0a0f;background:{{ p.color }};\">{{ p.initial }}<\u002Fspan>\n              <span style=\"flex:1;font:600 16px 'Space Grotesk';color:#f4f2f7;\">{{ p.name }}<\u002Fspan>\n              <button onclick=\"{{ p.remove }}\" aria-label=\"Remove\" style=\"width:32px;height:32px;border-radius:10px;border:1px solid #2a2935;background:transparent;color:#8b8898;cursor:pointer;display:grid;place-items:center;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- ============ HOW TO PLAY ============ -->\n      <sc-if value=\"{{ isHowto }}\" hint-placeholder-val=\"{{ true }}\">\n      <section data-screen-label=\"How To Play\" style=\"animation:screenIn .4s ease both;flex:1;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),22px) 22px max(env(safe-area-inset-bottom),24px);\">\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:18px;\">\n          <button onclick=\"{{ goHome }}\" aria-label=\"Back\" style=\"width:42px;height:42px;border-radius:50%;border:1px solid #2a2935;background:#16151c;color:#c9c6d4;cursor:pointer;display:grid;place-items:center;\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M15 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n          <h2 style=\"margin:0;font-family:'Anton';font-size:30px;text-transform:uppercase;color:#f4f2f7;\">How to Play<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px;flex:1;\">\n          <sc-for list=\"{{ howSteps }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:15px;padding:17px;border-radius:16px;border:1px solid #232230;background:#14131a;\">\n              <span style=\"flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:'Anton';font-size:22px;color:{{ s.color }};border:1px solid {{ s.color }}55;background:{{ s.color }}1a;\">{{ s.n }}<\u002Fspan>\n              <span style=\"display:flex;flex-direction:column;gap:3px;\"><span style=\"font:700 16px 'Space Grotesk';color:#f4f2f7;\">{{ s.title }}<\u002Fspan><span style=\"font:400 13px 'Space Grotesk';color:#9a97a8;line-height:1.4;\">{{ s.body }}<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <button onclick=\"{{ goCreate }}\" style=\"margin-top:16px;width:100%;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;\">Got it \\u2014 let's play<\u002Fbutton>\n      <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!--SENTINEL-->\n    <\u002Fdiv>\n\n    <!-- MODE SHEET -->\n    <sc-if value=\"{{ modeSheet }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeMode }}\" style=\"position:absolute;inset:0;background:rgba(6,5,9,.72);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:flex-end;animation:popIn .2s ease both;\">\n      <div style=\"width:100%;background:#16151c;border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid #2a2935;padding:14px 20px max(env(safe-area-inset-bottom),22px);animation:screenIn .28s ease both;\">\n        <div style=\"width:44px;height:5px;border-radius:999px;background:#3a3848;margin:0 auto 16px;\"><\u002Fdiv>\n        <h3 style=\"margin:0 0 4px;font-family:'Anton';font-size:26px;text-transform:uppercase;color:#f4f2f7;\">Game Mode<\u002Fh3>\n        <p style=\"margin:0 0 16px;font:400 13px 'Space Grotesk';color:#8b8898;\">How cruel do you want it?<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <sc-for list=\"{{ modeOptions }}\" as=\"m\" hint-placeholder-count=\"3\">\n            <button onclick=\"{{ m.onClick }}\" style=\"{{ m.style }}\">\n              <span style=\"flex:0 0 auto;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-family:'Anton';font-size:22px;color:#f5402e;background:#f5402e1a;border:1px solid #f5402e44;\">{{ m.initial }}<\u002Fspan>\n              <span style=\"flex:1;display:flex;flex-direction:column;gap:2px;text-align:left;\"><span style=\"font:700 16px 'Space Grotesk';color:#f4f2f7;\">{{ m.name }}<\u002Fspan><span style=\"font:400 12px 'Space Grotesk';color:#9a97a8;line-height:1.35;\">{{ m.desc }}<\u002Fspan><\u002Fspan>\n              <span style=\"{{ m.check }}\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3\"><path d=\"M5 12l5 5 9-11\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:412,&quot;height&quot;:892}}\">\nclass Component extends DCLogic {\n  state = {\n    route:'home', phase:'lobby',\n    mode:'classic', playerCount:6, impostorCount:1, timer:90,\n    difficulty:'normal', familySafe:true, adult:false, groupVote:false,\n    holdToReveal:true, soundOn:true, animOn:true, hapticsOn:true,\n    saved:['Maya','Theo','Priya','Diego','Jules','Sam','Noa','Kit','Rae','Ivo'],\n    players:[], nameDraft:'',\n    roles:[], pair:null, revealIndex:0, revealShown:false,\n    clueIndex:0, timeLeft:90, timerRunning:false,\n    voteIndex:0, votes:{}, voterChoice:null, selectedCandidate:null,\n    eliminated:null, eliminatedImpostor:false, guess:'', outcome:null, resultReason:'',\n    score:{civ:0,imp:0}, round:1, modeSheet:false,\n  };\n\n  PALETTE=['#f5402e','#e8b339','#46c2ff','#36c98a','#b083ff','#ff7ab0','#ffa14a','#5ad1c4','#ff6347','#7ed957'];\n  WORDS=[{c:'Beach',i:'Desert'},{c:'Coffee',i:'Tea'},{c:'Vampire',i:'Zombie'},{c:'Guitar',i:'Violin'},{c:'Pizza',i:'Burger'},{c:'Winter',i:'Autumn'},{c:'Doctor',i:'Nurse'},{c:'Ocean',i:'Lake'},{c:'Robot',i:'Alien'},{c:'Castle',i:'Tower'},{c:'Detective',i:'Spy'},{c:'Volcano',i:'Geyser'}];\n  MODES=[\n    {key:'classic',name:'Classic',desc:'Everyone gets the word. The impostor gets a believable decoy.'},\n    {key:'blank',name:'Blackout',desc:'Civilians share a word. The impostor gets nothing but nerve.'},\n    {key:'rivals',name:'Rivals',desc:'More impostors, more decoys. Trust absolutely no one.'},\n  ];\n\n  componentDidMount(){\n    this._iv=setInterval(()=>{\n      if(this.state.timerRunning && this.state.timeLeft>0){\n        this.setState(s=>{const t=s.timeLeft-1;return {timeLeft:t,timerRunning:t>0};});\n      }\n    },1000);\n  }\n  componentWillUnmount(){ clearInterval(this._iv); }\n\n  color(i){ return this.PALETTE[i%this.PALETTE.length]; }\n  go=(r)=>this.setState({route:r});\n  goHome=()=>this.setState({route:'home',phase:'lobby',timerRunning:false});\n  goCreate=()=>this.setState({route:'create'});\n  goSettings=()=>this.setState({route:'settings'});\n  goStats=()=>this.setState({route:'stats'});\n  goPacks=()=>this.setState({route:'packs'});\n  goPeople=()=>this.setState({route:'people'});\n  goHowto=()=>this.setState({route:'howto'});\n\n  openMode=()=>this.setState({modeSheet:true});\n  closeMode=()=>this.setState({modeSheet:false});\n  pickMode=(key)=>this.setState({mode:key,modeSheet:false,impostorCount:key==='rivals'?2:1});\n\n  incPlayers=()=>this.setState(s=>({playerCount:Math.min(12,s.playerCount+1)}));\n  decPlayers=()=>this.setState(s=>({playerCount:Math.max(3,s.playerCount-1)}));\n  incImp=()=>this.setState(s=>({impostorCount:Math.min(Math.max(1,Math.floor(s.playerCount/2)-1),s.impostorCount+1)}));\n  decImp=()=>this.setState(s=>({impostorCount:Math.max(1,s.impostorCount-1)}));\n  setTimer=(v)=>this.setState({timer:v,timeLeft:v});\n  setDiff=(v)=>this.setState({difficulty:v});\n  toggle=(f)=>this.setState(s=>({[f]:!s[f]}));\n\n  toLobby=()=>{\n    const players = this.state.players.length>=3 ? this.state.players : this.state.saved.slice(0,this.state.playerCount);\n    this.setState({players:[...players],route:'play',phase:'lobby'});\n  };\n  setDraft=(e)=>this.setState({nameDraft:e.target.value});\n  addDraft=()=>{\n    const n=this.state.nameDraft.trim(); if(!n) return;\n    this.setState(s=>({players:[...s.players,n],saved:s.saved.includes(n)?s.saved:[...s.saved,n],nameDraft:''}));\n  };\n  draftKey=(e)=>{ if(e.key==='Enter') this.addDraft(); };\n  addSaved=(name)=>this.setState(s=>s.players.includes(name)?{}:{players:[...s.players,name]});\n  removePlayer=(name)=>this.setState(s=>({players:s.players.filter(p=>p!==name)}));\n  reshuffle=()=>this.setState(s=>({players:[...s.players].sort(()=>Math.random()-0.5)}));\n  removeSaved=(name)=>this.setState(s=>({saved:s.saved.filter(p=>p!==name)}));\n  timerToggle=()=>{ if(this.state.timer===0) return; this.state.timerRunning?this.pauseTimer():this.startTimer(); };\n\n  startGame=()=>{\n    const names=this.state.players;\n    if(names.length<3) return;\n    const pair=this.WORDS[Math.floor(Math.random()*this.WORDS.length)];\n    const impCount=Math.min(this.state.impostorCount,names.length-1);\n    const imp=new Set();\n    while(imp.size<impCount){ imp.add(Math.floor(Math.random()*names.length)); }\n    const roles=names.map((name,i)=>{\n      const impostor=imp.has(i);\n      const word=impostor?(this.state.mode==='blank'?'':pair.i):pair.c;\n      return {name,impostor,word};\n    });\n    this.setState({roles,pair,phase:'reveal',revealIndex:0,revealShown:false,clueIndex:0,timeLeft:this.state.timer,timerRunning:false,votes:{},voteIndex:0,voterChoice:null,selectedCandidate:null,eliminated:null,guess:'',outcome:null});\n  };\n\n  holdStart=()=>{ if(this.state.holdToReveal) this.setState({revealShown:true}); };\n  holdEnd=()=>{ if(this.state.holdToReveal) this.setState({revealShown:false}); };\n  nextReveal=()=>{\n    const ni=this.state.revealIndex+1;\n    if(ni>=this.state.roles.length) this.setState({phase:'clue',clueIndex:0,revealShown:false});\n    else this.setState({revealIndex:ni,revealShown:false});\n  };\n\n  nextClue=()=>{\n    const ni=this.state.clueIndex+1;\n    if(ni>=this.state.roles.length) this.setState({phase:'discuss',timeLeft:this.state.timer,timerRunning:false});\n    else this.setState({clueIndex:ni});\n  };\n\n  startTimer=()=>this.setState({timerRunning:true});\n  pauseTimer=()=>this.setState({timerRunning:false});\n  toVote=()=>this.setState({phase:'vote',timerRunning:false,voteIndex:0,votes:{},voterChoice:null,selectedCandidate:null});\n\n  pickCandidate=(name)=>{ if(this.state.groupVote) this.setState({selectedCandidate:name}); else this.setState({voterChoice:name}); };\n  confirmVote=()=>{\n    if(this.state.groupVote){\n      if(!this.state.selectedCandidate) return;\n      this.resolve(this.state.selectedCandidate);\n      return;\n    }\n    if(!this.state.voterChoice) return;\n    const votes={...this.state.votes};\n    votes[this.state.voterChoice]=(votes[this.state.voterChoice]||0)+1;\n    const ni=this.state.voteIndex+1;\n    if(ni>=this.state.players.length){\n      let best=null,bv=-1; Object.keys(votes).forEach(k=>{if(votes[k]>bv){bv=votes[k];best=k;}});\n      this.setState({votes},()=>this.resolve(best));\n    } else {\n      this.setState({votes,voteIndex:ni,voterChoice:null});\n    }\n  };\n  resolve=(name)=>{\n    const role=this.state.roles.find(r=>r.name===name)||{};\n    if(role.impostor){\n      this.setState(s=>({eliminated:name,eliminatedImpostor:true,outcome:'civ',resultReason:'The table unmasked the impostor.',score:{civ:s.score.civ+1,imp:s.score.imp},phase:'result'}));\n    } else {\n      this.setState({eliminated:name,eliminatedImpostor:false,phase:'guess',guess:''});\n    }\n  };\n\n  setGuess=(e)=>this.setState({guess:e.target.value});\n  submitGuess=()=>{\n    const target=this.state.pair?this.state.pair.c.toLowerCase():'';\n    const correct=this.state.guess.trim().toLowerCase()===target;\n    this.setState(s=>({outcome:correct?'imp':'civ',resultReason:correct?'The impostor stole the secret word.':'The impostor guessed wrong — civilians escape.',score:correct?{civ:s.score.civ,imp:s.score.imp+1}:{civ:s.score.civ+1,imp:s.score.imp},phase:'result'}));\n  };\n\n  nextRound=()=>{ this.setState(s=>({round:s.round+1}),this.startGame); };\n  newGame=()=>this.setState({route:'create'});\n\n  renderVals(){\n    const S=this.state;\n    const chip=(active,accent='#f5402e')=> active\n      ? `padding:11px 17px;border-radius:999px;border:1px solid ${accent};background:${accent}24;color:#f4f2f7;font:600 14px 'Space Grotesk';cursor:pointer;white-space:nowrap;`\n      : `padding:11px 17px;border-radius:999px;border:1px solid #2a2935;background:transparent;color:#9a97a8;font:600 14px 'Space Grotesk';cursor:pointer;white-space:nowrap;`;\n    const track=on=>`flex:0 0 auto;width:52px;height:31px;border-radius:999px;padding:3px;display:flex;align-items:center;transition:background .2s;background:${on?'#f5402e':'#2a2935'};`;\n    const knob=on=>`width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .2s;transform:translateX(${on?'21px':'0px'});box-shadow:0 2px 6px rgba(0,0,0,.4);`;\n    const togRow='display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;background:transparent;border:0;border-top:1px solid #232230;padding:16px 0;cursor:pointer;text-align:left;';\n\n    const mode=this.MODES.find(m=>m.key===S.mode)||this.MODES[0];\n    const cur=S.roles[S.revealIndex]||{};\n    const clue=S.roles[S.clueIndex]||{};\n    const voter=S.players[S.voteIndex]||'';\n    const sel=S.groupVote?S.selectedCandidate:S.voterChoice;\n\n    const candidates=S.players.filter(p=>S.groupVote?true:p!==voter).map((name,i)=>({\n      name, initial:(name[0]||'?').toUpperCase(), color:this.color(S.players.indexOf(name)),\n      selected: sel===name,\n      onClick:()=>this.pickCandidate(name),\n    }));\n\n    const navCards=[\n      {key:'people',label:'People',desc:'Saved names',icon:'👥',onClick:this.goPeople},\n      {key:'packs',label:'Packs',desc:'Word sets',icon:'📦',onClick:this.goPacks},\n      {key:'stats',label:'Stats',desc:'Your record',icon:'📊',onClick:this.goStats},\n      {key:'howto',label:'How to play',desc:'60 seconds',icon:'？',onClick:this.goHowto},\n    ];\n\n    return {\n      animAttr: S.animOn?'on':'off',\n      isHome:S.route==='home', isCreate:S.route==='create', isSettings:S.route==='settings',\n      isStats:S.route==='stats', isPacks:S.route==='packs', isPeople:S.route==='people', isHowto:S.route==='howto',\n      isLobby:S.route==='play'&&S.phase==='lobby',\n      isReveal:S.route==='play'&&S.phase==='reveal',\n      isClue:S.route==='play'&&S.phase==='clue',\n      isDiscuss:S.route==='play'&&S.phase==='discuss',\n      isVote:S.route==='play'&&S.phase==='vote',\n      isGuess:S.route==='play'&&S.phase==='guess',\n      isResult:S.route==='play'&&S.phase==='result',\n      goHome:this.goHome, goCreate:this.goCreate, goSettings:this.goSettings, goStats:this.goStats,\n      goPacks:this.goPacks, goPeople:this.goPeople, goHowto:this.goHowto,\n      socialProof:'You\\u2019ve hosted 37 rounds', wordCount:248,\n      navCards: navCards.map(n=>({...n})),\n\n      // create\n      modeName:mode.name, modeDesc:mode.desc, modeInitial:mode.name[0],\n      playerCount:S.playerCount, impostorCount:S.impostorCount,\n      incPlayers:this.incPlayers, decPlayers:this.decPlayers, incImp:this.incImp, decImp:this.decImp,\n      openMode:this.openMode,\n      timerChips:[{v:45,l:'45s'},{v:90,l:'90s'},{v:180,l:'3 min'},{v:0,l:'Off'}].map(o=>({label:o.l,style:chip(S.timer===o.v),onClick:()=>this.setTimer(o.v)})),\n      diffChips:[{v:'chill',l:'Chill'},{v:'normal',l:'Normal'},{v:'ruthless',l:'Ruthless'}].map(o=>({label:o.l,style:chip(S.difficulty===o.v),onClick:()=>this.setDiff(o.v)})),\n      createToggles:[\n        {key:'familySafe',label:'Family-safe',desc:'Hide spicy words'},\n        {key:'adult',label:'18+ content',desc:'After-dark word pool'},\n        {key:'groupVote',label:'Group vote',desc:'Decide out loud, not in secret'},\n      ].map(t=>({label:t.label,desc:t.desc,track:track(S[t.key]),knob:knob(S[t.key]),row:togRow,onClick:()=>this.toggle(t.key)})),\n      toLobby:this.toLobby,\n\n      // lobby\n      lobbyStatus: S.players.length<3?`Add ${3-S.players.length} more to start`:`${S.players.length} seated \\u00b7 ready when you are`,\n      seatList:S.players.map((name,i)=>({name,initial:(name[0]||'?').toUpperCase(),color:this.color(i),seat:`Seat ${i+1}`,remove:()=>this.removePlayer(name)})),\n      nameDraft:S.nameDraft, setDraft:this.setDraft, addDraft:this.addDraft, draftKey:this.draftKey,\n      suggestions:S.saved.filter(n=>!S.players.includes(n)).slice(0,6).map(name=>({name,onClick:()=>this.addSaved(name)})),\n      hasSuggestions:S.saved.filter(n=>!S.players.includes(n)).length>0,\n      reshuffle:this.reshuffle, startGame:this.startGame,\n      startDisabled:S.players.length<3,\n      startLabel:S.players.length<3?'Need 3+ players':'Start Game',\n      startBtnStyle:S.players.length<3\n        ? \"flex:1;border:0;border-radius:18px;padding:20px;background:#1d1c25;color:#6b6878;font:700 18px 'Space Grotesk';cursor:not-allowed;\"\n        : \"flex:1;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;\",\n\n      // reveal\n      revealCover: !S.revealShown,\n      revealShown: S.revealShown,\n      revealName:cur.name, revealInitial:(cur.name?cur.name[0]:'?').toUpperCase(),\n      revealColor:this.color(S.revealIndex),\n      revealCounter:`Player ${S.revealIndex+1} of ${S.roles.length}`,\n      revealHoldLabel:S.holdToReveal?'Hold to reveal':'Tap to reveal',\n      revealCivilian: S.revealShown && !cur.impostor,\n      revealImpostor: S.revealShown && !!cur.impostor,\n      revealWord:cur.word,\n      impostorLead: S.mode==='blank' ? 'You get no word.' : 'Your decoy word is',\n      impostorWordDisplay: S.mode==='blank' ? 'Improvise' : cur.word,\n      revealNextLabel: S.revealIndex+1>=S.roles.length ? 'Got it \\u2014 start clues' : 'Got it \\u2014 pass on',\n      nextReveal:this.nextReveal, holdStart:this.holdStart, holdEnd:this.holdEnd,\n\n      // clue\n      clueName:clue.name, clueInitial:(clue.name?clue.name[0]:'?').toUpperCase(), clueColor:this.color(S.clueIndex),\n      clueProgress:`${S.clueIndex+1} / ${S.roles.length}`,\n      clueNextLabel: S.clueIndex+1>=S.roles.length ? 'Start the discussion' : 'Next player',\n      nextClue:this.nextClue,\n      clueDots:S.roles.map((r,i)=>({style:`flex:1;height:6px;border-radius:999px;background:${i<S.clueIndex?'#e8b339':i===S.clueIndex?'#f4f2f7':'#232230'};transition:background .3s;`})),\n\n      // discuss\n      discussPrompt:'Find the liar. Defend your word. Don\\u2019t overshare.',\n      ringDash:'829.38',\n      ringOffset:`${829.38*(1-(S.timer?(S.timeLeft/S.timer):1))}`,\n      ringColor:(S.timeLeft<=10 && S.timer!==0)?'#f5402e':'#46c2ff',\n      timeLabel: S.timer===0 ? '\\u221e' : `${Math.floor(S.timeLeft/60)}:${String(S.timeLeft%60).padStart(2,'0')}`,\n      timeState: S.timer===0?'No timer':(S.timeLeft===0?'Time\\u2019s up':S.timerRunning?'On the clock':'Paused'),\n      timerToggle:this.timerToggle, toVote:this.toVote,\n      timerBtnLabel: S.timer===0?'Talk it out':(S.timeLeft===0?'Time\\u2019s up':S.timerRunning?'Pause':'Start timer'),\n      timerBtnStyle: \"width:100%;border:0;border-radius:18px;padding:18px;background:#f5402e;color:#fff;font:700 17px 'Space Grotesk';cursor:pointer;box-shadow:0 12px 30px -12px #f5402ecc;\",\n\n      // vote\n      voteKicker: S.groupVote?'Decide together':`Ballot ${S.voteIndex+1} of ${S.players.length}`,\n      voteHeader: S.groupVote?'Group Vote':(voter||'Vote'),\n      voteSub: S.groupVote?'One final tap. No takebacks.':'Tap who you suspect, then pass the phone on.',\n      candidates: candidates.map(c=>({\n        name:c.name, initial:c.initial, color:c.color, onClick:c.onClick,\n        style: c.selected\n          ? \"position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;padding:18px 12px;border-radius:18px;border:1px solid #f5402e;background:#f5402e1f;cursor:pointer;box-shadow:0 0 32px -8px #f5402e;\"\n          : \"position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;padding:18px 12px;border-radius:18px;border:1px solid #232230;background:#14131a;cursor:pointer;\",\n        checkStyle: c.selected\n          ? \"position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:50%;background:#f5402e;display:grid;place-items:center;\"\n          : \"display:none;\",\n      })),\n      confirmVote:this.confirmVote,\n      confirmDisabled: S.groupVote ? !S.selectedCandidate : !S.voterChoice,\n      confirmLabel: !sel ? 'Tap a player' : (S.groupVote?`Vote out ${sel}`:'Lock in vote'),\n      confirmStyle: (S.groupVote?!S.selectedCandidate:!S.voterChoice)\n        ? \"width:100%;border:0;border-radius:18px;padding:20px;background:#1d1c25;color:#6b6878;font:700 18px 'Space Grotesk';cursor:not-allowed;\"\n        : \"width:100%;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;\",\n\n      // guess\n      eliminatedName:S.eliminated, guess:S.guess, setGuess:this.setGuess, submitGuess:this.submitGuess,\n      guessDisabled: !S.guess.trim(),\n      guessBtnStyle: !S.guess.trim()\n        ? \"width:100%;border:0;border-radius:18px;padding:20px;background:#1d1c25;color:#6b6878;font:700 18px 'Space Grotesk';cursor:not-allowed;\"\n        : \"width:100%;border:0;border-radius:18px;padding:20px;background:#f5402e;color:#fff;font:700 18px 'Space Grotesk';cursor:pointer;box-shadow:0 14px 34px -12px #f5402ecc;\",\n\n      // result\n      resultHeadline: S.outcome==='civ'?'Civilians Win':'Impostor Wins',\n      resultColor: S.outcome==='civ'?'#46c2ff':'#f5402e',\n      resultBadge: S.outcome==='civ'?'Justice served':'Got away with it',\n      resultBadgeStyle: S.outcome==='civ'\n        ? \"padding:7px 15px;border-radius:999px;border:1px solid #46c2ff55;background:#46c2ff1a;color:#46c2ff;font:700 11px 'Space Mono';letter-spacing:.18em;text-transform:uppercase;\"\n        : \"padding:7px 15px;border-radius:999px;border:1px solid #f5402e55;background:#f5402e1a;color:#f5402e;font:700 11px 'Space Mono';letter-spacing:.18em;text-transform:uppercase;\",\n      resultReason:S.resultReason,\n      impostorReveal:S.roles.filter(r=>r.impostor).map(r=>r.name).join(' & ')||'\\u2014',\n      secretWordReveal:S.pair?S.pair.c:'\\u2014',\n      votedOut:S.eliminated||'\\u2014',\n      scoreLabel:`${S.score.civ} / ${S.score.imp}`,\n      nextRound:this.nextRound, newGame:this.newGame,\n\n      // settings\n      settingsToggles:[\n        {key:'soundOn',label:'Sound',desc:'Cues, stings and the timer beep'},\n        {key:'animOn',label:'Animations',desc:'Motion and screen transitions'},\n        {key:'hapticsOn',label:'Haptics',desc:'A buzz on the big moments'},\n        {key:'holdToReveal',label:'Hold to reveal',desc:'Press and hold to expose your role'},\n      ].map(t=>({label:t.label,desc:t.desc,track:track(S[t.key]),knob:knob(S[t.key]),row:togRow,onClick:()=>this.toggle(t.key)})),\n\n      // stats\n      outcomeBars:[\n        {label:'Civilians caught the impostor',value:'21',pct:57,c:'#46c2ff'},\n        {label:'Impostor survived the vote',value:'10',pct:27,c:'#e8b339'},\n        {label:'Impostor stole the word',value:'6',pct:16,c:'#f5402e'},\n      ].map(b=>({label:b.label,value:b.value,fill:`height:100%;width:${b.pct}%;border-radius:999px;background:${b.c};`})),\n\n      // packs\n      packs:[\n        {name:'Core Mix',desc:'The everyday party deck \\u00b7 248 word pairs',emoji:'\\uD83C\\uDFB2',status:'Active',state:'active'},\n        {name:'Movies & TV',desc:'Blockbusters, binges and cult classics',emoji:'\\uD83C\\uDFAC',status:'Soon',state:'soon'},\n        {name:'After Dark',desc:'Spicier prompts for grown-up tables \\u00b7 18+',emoji:'\\uD83C\\uDF19',status:'Soon',state:'soon'},\n        {name:'Frostbite',desc:'Limited seasonal winter drop',emoji:'\\u2744\\uFE0F',status:'Seasonal',state:'seasonal'},\n        {name:'Word Forge',desc:'AI-generated packs on any theme you name',emoji:'\\u2728',status:'Beta',state:'ai'},\n      ].map(p=>{\n        const badgeC={active:'#36c98a',soon:'#8b8898',seasonal:'#46c2ff',ai:'#b083ff'}[p.state];\n        return {name:p.name,desc:p.desc,emoji:p.emoji,status:p.status,\n          card:p.state==='active'\n            ? \"display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid #36c98a44;background:linear-gradient(135deg,#102018,#12131a);\"\n            : \"display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px dashed #2f2d3a;background:#100f15;opacity:.85;\",\n          tint:p.state==='active'?'#36c98a1a':'#1d1c25',\n          border:p.state==='active'?'#36c98a44':'#2a2935',\n          badge:`flex:0 0 auto;padding:6px 12px;border-radius:999px;font:700 10px 'Space Mono';letter-spacing:.1em;text-transform:uppercase;color:${badgeC};border:1px solid ${badgeC}55;background:${badgeC}1a;`,\n        };\n      }),\n\n      // people\n      peopleStatus:`${S.saved.length} saved`,\n      peopleEmpty:S.saved.length===0, peopleHas:S.saved.length>0,\n      peopleList:S.saved.map((name,i)=>({name,initial:(name[0]||'?').toUpperCase(),color:this.color(i),remove:()=>this.removeSaved(name)})),\n\n      // how to play\n      howSteps:[\n        {n:'1',title:'Everyone gets a word',body:'All but one player share a secret word. The impostor gets a believable decoy \\u2014 or nothing at all.',color:'#46c2ff'},\n        {n:'2',title:'Drop a one-word clue',body:'Go around the table. Prove you know the word without ever saying it.',color:'#e8b339'},\n        {n:'3',title:'Discuss & accuse',body:'Debate who\\u2019s faking it. Beware clues that play it too safe.',color:'#f5402e'},\n        {n:'4',title:'Vote someone out',body:'In secret or as a group. Guess wrong and the impostor only gets bolder.',color:'#b083ff'},\n        {n:'5',title:'The last chance',body:'If the impostor survives the vote, they can still steal the win by naming the word.',color:'#36c98a'},\n      ],\n\n      // mode sheet\n      modeSheet:S.modeSheet, closeMode:this.closeMode,\n      modeOptions:this.MODES.map(m=>({name:m.name,desc:m.desc,initial:m.name[0],onClick:()=>this.pickMode(m.key),\n        style:m.key===S.mode\n          ? \"display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;border:1px solid #f5402e;background:#f5402e14;cursor:pointer;width:100%;\"\n          : \"display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;border:1px solid #232230;background:#100f15;cursor:pointer;width:100%;\",\n        check:m.key===S.mode\n          ? \"flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:#f5402e;display:grid;place-items:center;\"\n          : \"display:none;\",\n      })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
